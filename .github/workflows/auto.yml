name: Atualizar Tarifas Automaticamente

on:
  schedule:
    - cron: '0 10 * * *' # Roda todo dia às 07:00 (horário de Brasília)
  workflow_dispatch:      # Permite clicar no botão para testar manualmente

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install requests beautifulsoup4

      - name: Executar verificação de tarifas
        run: python atualizar.py

      - name: Salvar alterações no GitHub se houver mudança
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tarifas_vale.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza tarifas automaticamente" && git push)
