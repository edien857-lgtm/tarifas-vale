<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarifas Vale do Paraíba</title>
  <style>
    :root {
      --bg: #071324;
      --card: rgba(15, 31, 56, 0.88);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-bg: rgba(56, 189, 248, 0.14);
      --border: #1e3a63;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(circle at top, #0f294a 0%, #071324 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }
    /* Gládio Alado gigante em marca d'água no fundo da tela */
    .bg-gladio {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 680px;
      max-width: 95vw;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
      color: #ffffff;
    }
    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      max-width: 440px;
      width: 100%;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .header-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-block;
      background: var(--accent-bg);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .mini-gladio {
      width: 48px;
      height: auto;
      color: var(--accent);
      opacity: 0.9;
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { font-size: 0.88rem; color: var(--muted); margin: 0 0 22px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    select, input {
      width: 100%;
      padding: 12px;
      background: rgba(7, 19, 36, 0.85);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.98rem;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .atalhos {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .atalhos button {
      flex: 1;
      padding: 8px;
      background: rgba(7, 19, 36, 0.85);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .atalhos button:hover { border-color: var(--accent); color: var(--accent); }
    .resultado {
      background: var(--accent-bg);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .valor-unitario { font-size: 0.9rem; color: var(--muted); }
    .valor-total { font-size: 2.1rem; font-weight: 800; color: var(--accent); margin: 6px 0; }
    .data-att { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>

  <!-- Gládio Alado em vetor embutido no fundo -->
  <svg class="bg-gladio" viewBox="0 0 400 220" fill="currentColor" xmlns="http://w3.org">
    <!-- Lâmina e punho do sabre central -->
    <polygon points="200,12 193,42 193,155 207,155 207,42"/>
    <rect x="172" y="155" width="56" height="7" rx="3"/>
    <rect x="195" y="162" width="10" height="32" rx="2"/>
    <circle cx="200" cy="200" r="8"/>
    <!-- Asa Esquerda -->
    <path d="M188,125 C140,115 70,85 15,48 C35,75 75,95 125,108 C75,102 40,92 22,82 C48,104 88,118 135,125 C92,124 60,118 42,112 C68,128 105,137 148,140 C112,142 84,140 68,136 C95,148 135,152 188,146 Z"/>
    <!-- Asa Direita -->
    <path d="M212,125 C260,115 330,85 385,48 C365,75 325,95 275,108 C325,102 360,92 378,82 C352,104 312,118 265,125 C308,124 340,118 358,112 C332,128 295,137 252,140 C288,142 316,140 332,136 C305,148 265,152 212,146 Z"/>
  </svg>

  <div class="card">
    <div class="header-topo">
      <span class="badge">EMTU • Pássaro Marron</span>
      <!-- Mini Gládio Alado no topo do cartão -->
      <svg class="mini-gladio" viewBox="0 0 400 220" fill="currentColor" xmlns="http://w3.org">
        <polygon points="200,12 193,42 193,155 207,155 207,42"/>
        <rect x="172" y="155" width="56" height="7" rx="3"/>
        <rect x="195" y="162" width="10" height="32" rx="2"/>
        <circle cx="200" cy="200" r="8"/>
        <path d="M188,125 C140,115 70,85 15,48 C35,75 75,95 125,108 C75,102 40,92 22,82 C48,104 88,118 135,125 C92,124 60,118 42,112 C68,128 105,137 148,140 C112,142 84,140 68,136 C95,148 135,152 188,146 Z"/>
        <path d="M212,125 C260,115 330,85 385,48 C365,75 325,95 275,108 C325,102 360,92 378,82 C352,104 312,118 265,125 C308,124 340,118 358,112 C332,128 295,137 252,140 C288,142 316,140 332,136 C305,148 265,152 212,146 Z"/>
      </svg>
    </div>

    <h1>Consulta de Tarifas</h1>
    <p class="sub">Vale do Paraíba • Atualização automática</p>

    <label for="trecho">Trecho / Linha:</label>
    <select id="trecho"></select>

    <label for="qtd">Quantidade de passagens:</label>
    <input type="number" id="qtd" value="1" min="1" max="100">

    <div class="atalhos">
      <button type="button" onclick="setQtd(1)">Só Ida (1)</button>
      <button type="button" onclick="setQtd(2)">Ida e Volta (2)</button>
      <button type="button" onclick="setQtd(44)">Mês Útil (44)</button>
    </div>

    <div class="resultado">
      <div class="valor-unitario" id="unitario">Tarifa unitária: R$ 0,00</div>
      <div class="valor-total" id="total">R$ 0,00</div>
      <div class="data-att" id="atualizacao">Carregando dados...</div>
    </div>
  </div>

  <script>
    let tarifas = {};

    function setQtd(n) {
      document.getElementById('qtd').value = n;
      calcular();
    }

    async function carregarTarifas() {
      try {
        const resposta = await fetch('tarifas_vale.json?nocache=' + Date.now());
        tarifas = await resposta.json();

        const select = document.getElementById('trecho');
        select.innerHTML = '';

        Object.keys(tarifas).forEach(nomeTrecho => {
          const opt = document.createElement('option');
          opt.value = nomeTrecho;
          opt.textContent = nomeTrecho;
          select.appendChild(opt);
        });

        calcular();
      } catch (e) {
        document.getElementById('atualizacao').textContent = 'Erro ao carregar tarifas.';
      }
    }

    function calcular() {
      const trecho = document.getElementById('trecho').value;
      const qtd = parseInt(document.getElementById('qtd').value) || 1;
      const item = tarifas[trecho];

      if (!item) return;

      const total = item.valor * qtd;
      document.getElementById('unitario').textContent =
        `Tarifa unitária: R$ ${item.valor.toFixed(2).replace('.', ',')}`;
      document.getElementById('total').textContent =
        `R$ ${total.toFixed(2).replace('.', ',')}`;
      document.getElementById('atualizacao').textContent =
        `Última verificação: ${item.atualizado_em}`;
    }

    document.getElementById('trecho').addEventListener('change', calcular);
    document.getElementById('qtd').addEventListener('input', calcular);

    carregarTarifas();
  </script>
</body>
</html>
